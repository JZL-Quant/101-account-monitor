<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>KuCoin现货/合约对冲</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 18px; background: #f3f4f6; color: #111827; font: 14px system-ui, sans-serif; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        h1, h2 { margin: 0; }
        h1 { font-size: 22px; }
        h2 { margin-bottom: 10px; font-size: 17px; }
        button { padding: 7px 11px; border: 1px solid #9ca3af; border-radius: 5px; background: white; cursor: pointer; }
        button.danger { color: white; border-color: #b91c1c; background: #b91c1c; }
        button:disabled { opacity: .5; cursor: wait; }
        section { margin: 12px 0; padding: 14px; background: white; border: 1px solid #d1d5db; border-radius: 7px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: right; }
        th:first-child, td:first-child { text-align: left; }
        th { color: #4b5563; font-size: 12px; }
        .summary { display: flex; flex-wrap: wrap; gap: 10px 24px; }
        .summary div { min-width: 150px; }
        .summary span { display: block; color: #6b7280; font-size: 12px; }
        .summary strong { font-size: 18px; }
        .good { color: #047857; }
        .warn { color: #b45309; }
        .bad { color: #b91c1c; }
        #message { min-height: 20px; margin: 8px 0; white-space: pre-wrap; }
        .muted { color: #6b7280; }
        @media (max-width: 700px) { body { padding: 10px; } }
    </style>
</head>
<body>
<header>
    <div>
        <h1>KuCoin现货/合约对冲</h1>
        <span class="muted">用户：{{ username }}</span>
    </div>
    <div>
        <button id="refreshButton">立即刷新</button>
        <button id="logoutButton">退出</button>
    </div>
</header>
<div id="message"></div>

<section>
    <h2>账户概览</h2>
    <div id="summary" class="summary"></div>
    <p id="freshness" class="muted"></p>
</section>

<section>
    <h2>现货 / 合约对冲检查</h2>
    <table>
        <thead><tr>
            <th>币种</th><th>现货数量</th><th>可卖现货</th><th>合约币数量</th>
            <th>净敞口</th><th>净敞口价值</th><th>偏差率</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="hedges"></tbody>
    </table>
</section>

<section>
    <h2>Futures持仓</h2>
    <table>
        <thead><tr>
            <th>合约</th><th>方向</th><th>合约张数</th><th>每张面值</th><th>折合标的币（带方向）</th>
            <th>每张折合 USDT</th><th>开仓均价</th><th>标记价格</th><th>仓位折合 USDT</th>
            <th>换算校验</th><th>误差</th><th>未实现盈亏</th><th>杠杆</th><th>模式</th><th>强平价</th>
        </tr></thead>
        <tbody id="futures"></tbody>
    </table>
</section>

<section>
    <h2>现货余额</h2>
    <table>
        <thead><tr><th>币种</th><th>账户类型</th><th>余额</th><th>负债</th><th>净现货</th><th>权益</th><th>可用</th><th>冻结</th></tr></thead>
        <tbody id="spot"></tbody>
    </table>
</section>

<section>
    <h2>最近平仓操作</h2>
    <table>
        <thead><tr><th>时间</th><th>币种</th><th>状态</th><th>错误</th></tr></thead>
        <tbody id="actions"></tbody>
    </table>
</section>

<script>
const csrf = document.querySelector('meta[name="csrf-token"]').content;
const message = document.getElementById('message');
let latestData = null;

function n(value, digits = 6) {
    const number = Number(value || 0);
    return Number.isFinite(number)
        ? number.toLocaleString('zh-CN', { maximumFractionDigits: digits })
        : '-';
}
function statusClass(status) {
    if (status === '已对冲') return 'good';
    if (status.includes('轻微')) return 'warn';
    return 'bad';
}
function errorText(error) {
    return error?.detail || error?.message || JSON.stringify(error);
}
async function api(url, options = {}) {
    const response = await fetch(url, { credentials: 'same-origin', ...options });
    if (response.status === 401) { location.href = '/login'; throw new Error('请先登录'); }
    const data = await response.json();
    if (!response.ok) throw new Error(errorText(data));
    return data;
}
function render(data) {
    latestData = data;
    const s = data.summary || {};
    document.getElementById('summary').innerHTML = `
        <div><span>Futures账户权益</span><strong>${n(s.account_equity, 2)} USDT</strong></div>
        <div><span>可用余额</span><strong>${n(s.available_balance, 2)} USDT</strong></div>
        <div><span>多头合约敞口</span><strong>${n(s.long_exposure, 2)} USDT</strong></div>
        <div><span>空头合约敞口</span><strong>${n(s.short_exposure, 2)} USDT</strong></div>
        <div><span>未实现盈亏</span><strong>${n(s.unrealised_pnl, 2)} USDT</strong></div>
        <div><span>合约换算校验</span><strong class="${s.conversion_all_ok ? 'good' : 'bad'}">${s.conversion_all_ok ? '全部通过' : '存在异常'}</strong></div>`;
    const attempt = data.last_attempt || {};
    document.getElementById('freshness').textContent =
        `数据时间：${data.sampled_at || '尚无成功数据'}　状态：${data.stale ? '已过期' : '正常'}`
        + (attempt.status === 'failed' ? `　最近错误：${attempt.error_message}` : '');

    document.getElementById('hedges').innerHTML = (data.hedges || []).map(row => `
        <tr>
            <td>${row.asset}</td><td>${n(row.spot_qty)}</td><td>${n(row.spot_trade_available)}</td>
            <td>${n(row.futures_qty)}</td><td>${n(row.net_qty)}</td><td>${n(row.net_value, 2)} USDT</td>
            <td>${n(row.mismatch_percent, 2)}%</td>
            <td class="${statusClass(row.status)}">${row.status}</td>
            <td><button class="danger close-button" data-asset="${row.asset}"
                ${data.trading_enabled ? '' : 'disabled'}>双边平仓</button></td>
        </tr>`).join('') || '<tr><td colspan="9">暂无敞口</td></tr>';

    const exposureAsset = symbol => {
        const hedge = (data.hedges || []).find(item =>
            (item.futures_symbols || []).includes(symbol));
        return hedge?.asset || '';
    };
    document.getElementById('futures').innerHTML = (data.futures_positions || []).map(row => `
        <tr><td>${row.symbol}</td><td>${row.side === 'long' ? '多' : '空'}</td>
        <td>${n(Math.abs(Number(row.current_qty)))}</td><td>${n(row.multiplier, 10)} ${exposureAsset(row.symbol) || row.base_currency}/张</td>
        <td>${n(row.base_qty)} ${exposureAsset(row.symbol) || row.base_currency}</td><td>${n(row.per_contract_mark_value, 4)} USDT</td>
        <td>${n(row.avg_entry_price, 4)}</td>
        <td>${n(row.mark_price, 4)}</td><td>${n(row.mark_value, 2)} USDT</td>
        <td class="${row.conversion_ok ? 'good' : 'bad'}">${row.conversion_ok ? '通过' : '异常'}</td>
        <td>${n(row.conversion_error_percent, 4)}%</td><td>${n(row.unrealised_pnl, 4)}</td>
        <td>${n(row.leverage, 2)}x</td><td>${row.margin_mode}</td><td>${n(row.liquidation_price, 4)}</td></tr>`
    ).join('') || '<tr><td colspan="15">暂无合约持仓</td></tr>';

    document.getElementById('spot').innerHTML = (data.spot_balances || []).map(row => `
        <tr><td>${row.currency}</td><td>${row.account_type}</td><td>${n(row.balance)}</td>
        <td>${n(row.liability)}</td><td>${n(Number(row.balance) - Number(row.liability))}</td>
        <td>${n(row.equity)}</td><td>${n(row.available)}</td><td>${n(row.holds)}</td></tr>`
    ).join('') || '<tr><td colspan="8">暂无现货余额</td></tr>';

    document.getElementById('actions').innerHTML = (data.actions || []).map(row => `
        <tr><td>${row.created_at}</td><td>${row.asset}</td><td>${row.status}</td>
        <td class="bad">${row.error_message || ''}</td></tr>`
    ).join('') || '<tr><td colspan="4">暂无操作</td></tr>';

    document.querySelectorAll('.close-button').forEach(button => {
        button.addEventListener('click', () => closeBoth(button.dataset.asset, button));
    });
}
async function load() {
    try { render(await api('/api/kucoin/exposure/latest')); }
    catch (error) { message.className = 'bad'; message.textContent = error.message; }
}
async function closeBoth(asset, button) {
    button.disabled = true;
    try {
        const p = await api(`/api/kucoin/exposure/${encodeURIComponent(asset)}/close-preview`);
        const text = `将同时处理 ${asset} 两侧：\n\n`
            + `现货总量：${n(p.spot_qty)}\n可直接卖出现货：${n(p.spot_trade_available)}\n`
            + `合约币数量：${n(p.futures_qty)}\n当前净敞口：${n(p.net_qty)}\n\n`
            + `将市价卖出可交易现货，并平掉全部相关 Futures 仓位。\n`
            + `普通活动委托会先撤销；请另行确认条件单/止损单。确认执行？`;
        if (!confirm(text)) return;
        message.className = 'warn';
        message.textContent = `${asset} 双边平仓执行中，请勿重复操作……`;
        const result = await api(`/api/kucoin/exposure/${encodeURIComponent(asset)}/close-both`, {
            method: 'POST', headers: {'X-CSRF-Token': csrf}
        });
        message.className = result.status === 'complete' ? 'good' : 'bad';
        message.textContent = result.status === 'complete'
            ? `${asset} 双边平仓完成`
            : `${asset} 未完全平掉，请检查残余敞口和操作记录`;
        await load();
    } catch (error) {
        message.className = 'bad';
        message.textContent = `平仓失败：${error.message}`;
        await load();
    } finally { button.disabled = false; }
}
document.getElementById('refreshButton').addEventListener('click', async event => {
    event.target.disabled = true;
    try {
        await api('/api/kucoin/exposure/refresh', {method: 'POST', headers: {'X-CSRF-Token': csrf}});
        await load();
    } catch (error) { message.className = 'bad'; message.textContent = error.message; }
    finally { event.target.disabled = false; }
});
document.getElementById('logoutButton').addEventListener('click', async () => {
    await api('/logout', {method: 'POST', headers: {'X-CSRF-Token': csrf}});
    location.href = '/login';
});
load();
setInterval(load, 30000);
</script>
</body>
</html>
