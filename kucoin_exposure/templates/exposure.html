<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>KuCoin现货/合约对冲</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 18px; background: #f3f4f6; color: #111827; font: 14px system-ui, sans-serif; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        h1, h2 { margin: 0; }
        h1 { font-size: 22px; }
        h2 { margin-bottom: 10px; font-size: 17px; }
        .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
        .section-heading h2 { margin-bottom: 0; }
        .record-columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
        .record-column { min-width: 0; overflow-x: auto; }
        .record-column h2 { margin-bottom: 10px; }
        button { padding: 7px 11px; border: 1px solid #9ca3af; border-radius: 5px; background: white; cursor: pointer; }
        button.danger { color: white; border-color: #b91c1c; background: #b91c1c; }
        button:disabled { opacity: .5; cursor: wait; }
        section { margin: 12px 0; padding: 14px; background: white; border: 1px solid #d1d5db; border-radius: 7px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: right; }
        th:first-child, td:first-child { text-align: left; }
        th { color: #4b5563; font-size: 12px; }
        .summary { display: flex; flex-wrap: wrap; gap: 10px 24px; }
        .summary div { min-width: 150px; }
        .summary span { display: block; color: #6b7280; font-size: 12px; }
        .summary strong { font-size: 18px; }
        .risk-gate { margin-top: 12px; padding: 10px 12px; border-radius: 5px; background: #f9fafb; }
        .risk-gate p { margin: 4px 0; }
        .good { color: #047857; }
        .warn { color: #b45309; }
        .bad { color: #b91c1c; }
        #message { min-height: 20px; margin: 8px 0; white-space: pre-wrap; }
        .muted { color: #6b7280; }
        @media (max-width: 900px) {
            body { padding: 10px; }
            .record-columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<header>
    <div>
        <h1>KuCoin现货/合约对冲</h1>
        <span class="muted">用户：{{ username }}</span>
    </div>
    <div>
        <button id="closeAllButton" class="danger" disabled>全部平仓</button>
        <button id="refreshButton">立即刷新</button>
        <button id="logoutButton">退出</button>
    </div>
</header>
<div id="message"></div>

<section>
    <h2>账户概览</h2>
    <div id="summary" class="summary"></div>
    <div id="openingRiskGate" class="risk-gate"></div>
    <p id="freshness" class="muted"></p>
</section>

<section>
    <h2>现货 / 合约对冲检查</h2>
    <table>
        <thead><tr>
            <th>币种</th><th>现货数量</th><th>可卖现货</th><th>合约币数量</th>
            <th>净敞口</th><th>净敞口价值</th><th>偏差率</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="hedges"></tbody>
    </table>
</section>

<section>
    <h2>KCS储备</h2>
    <div id="kcsReserve" class="summary"></div>
</section>

<section>
    <h2>Futures持仓</h2>
    <table>
        <thead><tr>
            <th>合约</th><th>方向</th><th>合约张数</th><th>每张面值</th><th>折合标的币（带方向）</th>
            <th>每张折合 USDT</th><th>开仓均价</th><th>标记价格</th><th>仓位折合 USDT</th>
        </tr></thead>
        <tbody id="futures"></tbody>
    </table>
</section>

<section>
    <h2>现货余额</h2>
    <table>
        <thead><tr><th>币种</th><th>余额</th><th>负债</th><th>净现货</th><th>权益</th><th>可用</th><th>冻结</th><th>折合 USDT</th></tr></thead>
        <tbody id="spot"></tbody>
    </table>
</section>

<section>
    <h2>统一账户总权益走势</h2>
    <p class="muted">最近 1,440 个成功快照，单位：USDT</p>
    <div id="equityChart"></div>
</section>

<script>
const csrf = document.querySelector('meta[name="csrf-token"]').content;
const basePath = {{ base_path | tojson }};
const loginPath = {{ login_path | tojson }};
const message = document.getElementById('message');
let latestData = null;
const appUrl = path => `${basePath}${path}`;

function n(value, digits = 6) {
    const number = Number(value || 0);
    return Number.isFinite(number)
        ? number.toLocaleString('zh-CN', { maximumFractionDigits: digits })
        : '-';
}
function q(value) {
    const number = Number(value || 0);
    if (!Number.isFinite(number)) return '-';
    if (number !== 0 && Math.abs(number) < 1e-12) {
        return number.toExponential(8);
    }
    return number.toLocaleString('zh-CN', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 12
    });
}
function statusClass(status) {
    if (status === '已对冲') return 'good';
    if (status === '现货储备') return '';
    if (status.includes('轻微')) return 'warn';
    return 'bad';
}
function errorText(error) {
    return error?.detail || error?.message || JSON.stringify(error);
}
function approximateTime(value) {
    const time = new Date(value);
    if (!Number.isFinite(time.getTime())) return value || '-';
    return time.toLocaleString('zh-CN', {
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
        hour12: false
    });
}
function actionStatus(value) {
    return {
        complete: '完成',
        already_flat: '无需平仓',
        partial_or_failed: '部分完成',
        failed: '失败'
    }[value] || value || '-';
}
function actionQuantity(row) {
    if (row.asset === 'ALL') {
        return `共 ${(row.assets || []).length} 个币种`;
    }
    const values = [];
    if (row.spot_qty !== null && row.spot_qty !== undefined) {
        values.push(`现货 ${q(row.spot_qty)}`);
    }
    if (row.futures_qty !== null && row.futures_qty !== undefined) {
        values.push(`合约 ${q(row.futures_qty)}`);
    }
    return values.join('；') || '未取得数量';
}
function tradeDirection(row, leg) {
    if (String(leg).startsWith('spot:')) return '卖出';
    const quantity = Number(row.futures_qty || 0);
    if (quantity > 0) return '卖出平多';
    if (quantity < 0) return '买入平空';
    return '平仓';
}
function tradeQuantity(row, leg) {
    return String(leg).startsWith('spot:')
        ? q(row.spot_qty)
        : q(Math.abs(Number(row.futures_qty || 0)));
}
async function api(url, options = {}) {
    const response = await fetch(url, { credentials: 'same-origin', ...options });
    if (response.status === 401) { location.href = loginPath; throw new Error('请先登录'); }
    const text = await response.text();
    let data;
    try {
        data = text ? JSON.parse(text) : {};
    } catch (_error) {
        data = {
            detail: text.trim() || `服务器返回了非 JSON 响应（HTTP ${response.status}）`
        };
    }
    if (!response.ok) throw new Error(errorText(data));
    return data;
}
function render(data) {
    latestData = data;
    const displayDust = Number(data.display_dust_value_usdt ?? 0.1);
    document.getElementById('closeAllButton').disabled = !data.trading_enabled;
    const s = data.summary || {};
    document.getElementById('summary').innerHTML = `
        <div><span>统一账户总权益</span><strong>${n(s.account_equity, 2)} USDT</strong></div>
        <div><span>合约可用保证金</span><strong>${n(s.available_balance, 2)} USDT</strong></div>
        <div><span>现货总持仓</span><strong>${n(s.spot_total_position, 2)} USDT</strong></div>
        <div><span>Futures 总持仓</span><strong>${n(s.futures_total_position, 2)} USDT</strong></div>
        <div><span>MMR（维持保证金安全倍数）</span><strong>${n(s.mmr, 3)}×</strong></div>
        <div><span>IMR（初始保证金安全倍数）</span><strong>${n(s.imr, 3)}×</strong></div>
        <div><span>未对冲多头敞口</span><strong>${n(s.long_exposure, 2)} USDT</strong></div>
        <div><span>未对冲空头敞口</span><strong>${n(s.short_exposure, 2)} USDT</strong></div>`;
    const gate = s.opening_risk_gate || {};
    const gateClass = gate.is_risky ? 'bad' : (gate.is_safe ? 'good' : 'warn');
    document.getElementById('openingRiskGate').innerHTML = `
        <p><strong class="${gateClass}">风险门控结果：${gate.result || '-'}</strong></p>
        <p>停止开仓条件：<code>${gate.stop_condition || 'MMR < 6.0 或 IMR < 1.2'}</code>
           　当前：${gate.is_risky ? '已触发' : '未触发'}</p>
        <p>恢复开仓条件：<code>${gate.resume_condition || 'MMR > 6.44 且 IMR > 1.77'}</code>
           　当前：${gate.is_safe ? '已满足' : '未满足'}</p>
        <p class="muted">${gate.detail || ''}</p>`;
    const attempt = data.last_attempt || {};
    document.getElementById('freshness').textContent =
        `数据时间：${data.sampled_at || '尚无成功数据'}　状态：${data.stale ? '已过期' : '正常'}`
        + (attempt.status === 'failed' ? `　最近错误：${attempt.error_message}` : '');

    const hedgeRows = (data.hedges || []).filter(row => {
        if (row.excluded_from_hedge) return false;
        const price = Math.abs(Number(row.price || 0));
        const spotLegValue = Math.abs(Number(row.spot_qty || 0)) * price;
        const futuresLegValue = Math.abs(Number(row.futures_qty || 0)) * price;
        return Math.max(spotLegValue, futuresLegValue) >= displayDust;
    });
    document.getElementById('hedges').innerHTML = hedgeRows.map(row => `
        <tr>
            <td>${row.asset}</td><td>${q(row.spot_qty)}</td><td>${q(row.spot_trade_available)}</td>
            <td>${q(row.futures_qty)}</td><td>${q(row.net_qty)}</td><td>${n(row.net_value, 4)} USDT</td>
            <td>${n(row.mismatch_percent, 2)}%</td>
            <td class="${statusClass(row.status)}">${row.status}</td>
            <td><button class="danger close-button" data-asset="${row.asset}"
                    ${data.trading_enabled ? '' : 'disabled'}>双边平仓</button></td>
        </tr>`).join('') || '<tr><td colspan="9">暂无敞口</td></tr>';

    const kcs = (data.hedges || []).find(row => row.asset === 'KCS' && row.excluded_from_hedge);
    document.getElementById('kcsReserve').innerHTML = kcs
        ? `<div><span>现货数量</span><strong>${q(kcs.spot_qty)} KCS</strong></div>
           <div><span>折合价值</span><strong>${n(kcs.net_value, 2)} USDT</strong></div>`
        : '<span class="muted">暂无 KCS 储备</span>';

    const exposureAsset = symbol => {
        const hedge = (data.hedges || []).find(item =>
            (item.futures_symbols || []).includes(symbol));
        return hedge?.asset || '';
    };
    document.getElementById('futures').innerHTML = (data.futures_positions || [])
        .filter(row => Math.abs(Number(row.mark_value || 0)) >= displayDust)
        .map(row => `
        <tr><td>${row.symbol}</td><td>${row.side === 'long' ? '多' : '空'}</td>
        <td>${q(Math.abs(Number(row.current_qty)))}</td><td>${q(row.multiplier)} ${exposureAsset(row.symbol) || row.base_currency}/张</td>
        <td>${q(row.base_qty)} ${exposureAsset(row.symbol) || row.base_currency}</td><td>${n(row.per_contract_mark_value, 4)} USDT</td>
        <td>${n(row.avg_entry_price, 4)}</td>
        <td>${n(row.mark_price, 4)}</td><td>${n(row.mark_value, 2)} USDT</td></tr>`
    ).join('') || '<tr><td colspan="9">暂无合约持仓</td></tr>';

    const hedgeByAsset = new Map((data.hedges || []).map(row => [row.asset, row]));
    document.getElementById('spot').innerHTML = (data.spot_balances || [])
        .filter(row => row.currency !== 'KCS')
        .filter(row => {
            const hedge = hedgeByAsset.get(row.currency);
            const price = row.currency === 'USDT' ? 1 : Number(hedge?.price || 0);
            return Math.abs(Number(row.equity) * price) >= displayDust;
        })
        .map(row => {
        const hedge = hedgeByAsset.get(row.currency);
        const netSpot = Number(row.equity);
        const spotValue = row.currency === 'USDT'
            ? netSpot
            : (hedge ? netSpot * Number(hedge.price || 0) : 0);
        return `
        <tr><td>${row.currency}</td><td>${q(row.balance)}</td>
        <td>${q(row.liability)}</td><td>${q(row.equity)}</td>
        <td>${q(row.equity)}</td><td>${q(row.available)}</td><td>${q(row.holds)}</td>
        <td>${n(spotValue, 2)} USDT</td></tr>`;
    })
        .join('') || '<tr><td colspan="8">暂无现货余额</td></tr>';

    renderEquityChart(data.equity_history || []);

    document.querySelectorAll('.close-button').forEach(button => {
        button.addEventListener('click', () => closeBoth(button.dataset.asset, button));
    });
}
function renderEquityChart(points) {
    const target = document.getElementById('equityChart');
    const values = points.map(p => Number(p.equity)).filter(Number.isFinite);
    if (values.length < 2) {
        target.innerHTML = '<p class="muted">历史数据不足，至少需要两个成功快照。</p>';
        return;
    }
    const width = 1000, height = 260, left = 70, right = 18, top = 18, bottom = 36;
    let min = Math.min(...values), max = Math.max(...values);
    const pad = Math.max((max - min) * .12, Math.abs(max) * .005, .01);
    min -= pad; max += pad;
    const x = i => left + i * (width-left-right) / (values.length-1);
    const y = v => top + (max-v) * (height-top-bottom) / (max-min);
    const path = values.map((v,i) => `${i ? 'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    target.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="统一账户总权益走势" style="width:100%;min-width:620px">
      <line x1="${left}" y1="${top}" x2="${left}" y2="${height-bottom}" stroke="#9ca3af"/>
      <line x1="${left}" y1="${height-bottom}" x2="${width-right}" y2="${height-bottom}" stroke="#9ca3af"/>
      <line x1="${left}" y1="${y((min+max)/2)}" x2="${width-right}" y2="${y((min+max)/2)}" stroke="#e5e7eb"/>
      <path d="${path}" fill="none" stroke="#2563eb" stroke-width="2.5"/>
      <text x="${left-8}" y="${y(max)+5}" text-anchor="end" fill="#6b7280">${n(max,2)}</text>
      <text x="${left-8}" y="${y(min)+5}" text-anchor="end" fill="#6b7280">${n(min,2)}</text>
      <text x="${left}" y="${height-10}" fill="#6b7280">${approximateTime(points[0].sampled_at)}</text>
      <text x="${width-right}" y="${height-10}" text-anchor="end" fill="#6b7280">${approximateTime(points.at(-1).sampled_at)}</text>
      <circle cx="${x(values.length-1)}" cy="${y(values.at(-1))}" r="4" fill="#2563eb"/>
      <text x="${x(values.length-1)-8}" y="${y(values.at(-1))-10}" text-anchor="end" fill="#111827">${n(values.at(-1),2)} USDT</text>
    </svg>`;
}
async function load() {
    try { render(await api(appUrl('/api/kucoin/exposure/latest'))); }
    catch (error) { message.className = 'bad'; message.textContent = error.message; }
}
async function closeBoth(asset, button) {
    button.disabled = true;
    try {
        const p = await api(appUrl(`/api/kucoin/exposure/${encodeURIComponent(asset)}/close-preview`));
        const text = `将同时处理 ${asset} 两侧：\n\n`
            + `现货总量：${q(p.spot_qty)}\n可直接卖出现货：${q(p.spot_trade_available)}\n`
            + `合约币数量：${q(p.futures_qty)}\n当前净敞口：${q(p.net_qty)}\n\n`
            + `将市价卖出可交易现货，并平掉全部相关 Futures 仓位。\n`
            + `普通活动委托会先撤销；请另行确认条件单/止损单。确认执行？`;
        if (!confirm(text)) return;
        message.className = 'warn';
        message.textContent = `${asset} 双边平仓执行中，请勿重复操作……`;
        const result = await api(appUrl(`/api/kucoin/exposure/${encodeURIComponent(asset)}/close-both`), {
            method: 'POST', headers: {'X-CSRF-Token': csrf}
        });
        message.className = result.status === 'complete' ? 'good' : 'bad';
        message.textContent = result.status === 'complete'
            ? `${asset} 双边平仓完成`
            : `${asset} 未完全平掉，请检查残余敞口和操作记录`;
        await load();
    } catch (error) {
        message.className = 'bad';
        message.textContent = `平仓失败：${error.message}`;
        await load();
    } finally { button.disabled = false; }
}
async function closeAll() {
    const button = document.getElementById('closeAllButton');
    const assets = (latestData?.hedges || [])
        .filter(row => !row.excluded_from_hedge
            && (Math.abs(Number(row.spot_qty || 0)) > 0
                || Math.abs(Number(row.futures_qty || 0)) > 0))
        .map(row => row.asset);
    if (!assets.length) {
        message.className = 'good';
        message.textContent = '当前没有需要平仓的资产';
        return;
    }
    const text = `即将全部平仓：${assets.join(', ')}\n\n`
        + `程序会逐个币种卖出可交易现货，并对全部相关 Futures 仓位提交 reduce-only 市价平仓。\n`
        + `普通活动委托会先检查并撤销；单个币种失败后仍会继续处理其他币种。\n\n`
        + `这是不可撤销的真实交易，确认执行？`;
    if (!confirm(text)) return;
    button.disabled = true;
    document.querySelectorAll('.close-button').forEach(item => item.disabled = true);
    message.className = 'warn';
    message.textContent = '全部平仓执行中，请勿关闭页面或重复操作……';
    try {
        const result = await api(appUrl('/api/kucoin/exposure/close-all'), {
            method: 'POST', headers: {'X-CSRF-Token': csrf}
        });
        const failed = (result.results || [])
            .filter(item => !item.ok)
            .map(item => `${item.asset}: ${item.error || '仍有残余'}`);
        message.className = result.status === 'complete' ? 'good' : 'bad';
        message.textContent = result.status === 'complete'
            ? `全部平仓完成：${(result.assets || []).join(', ')}`
            : `部分币种未完成：\n${failed.join('\n')}`;
        await load();
    } catch (error) {
        message.className = 'bad';
        message.textContent = `全部平仓失败：${error.message}`;
        await load();
    } finally {
        button.disabled = !(latestData?.trading_enabled);
    }
}
document.getElementById('closeAllButton').addEventListener('click', closeAll);
document.getElementById('refreshButton').addEventListener('click', async event => {
    event.target.disabled = true;
    try {
        message.className = 'warn';
        message.textContent = '正在向 KuCoin 查询最新余额和持仓…';
        await api(appUrl('/api/kucoin/exposure/refresh'), {method: 'POST', headers: {'X-CSRF-Token': csrf}});
        await load();
        message.className = 'good';
        message.textContent = '已从 KuCoin 获取最新数据';
    } catch (error) { message.className = 'bad'; message.textContent = error.message; }
    finally { event.target.disabled = false; }
});
document.getElementById('logoutButton').addEventListener('click', async () => {
    await api(appUrl('/logout'), {method: 'POST', headers: {'X-CSRF-Token': csrf}});
    location.href = loginPath;
});
load();
setInterval(load, 30000);
</script>
</body>
</html>
