<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KuCoin敞口登录</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f4f6; font: 15px system-ui, sans-serif; color: #111827; }
        main { width: min(360px, calc(100% - 32px)); padding: 28px; background: white; border: 1px solid #d1d5db; border-radius: 10px; }
        h1 { margin: 0 0 22px; font-size: 22px; }
        label { display: block; margin: 14px 0 6px; font-weight: 600; }
        input, button { width: 100%; padding: 10px 12px; border-radius: 6px; font: inherit; }
        input { border: 1px solid #9ca3af; }
        button { margin-top: 20px; border: 0; color: white; background: #111827; cursor: pointer; }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
<main>
    <h1>KuCoin敞口监控</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ base_path }}/login">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">登录</button>
    </form>
</main>
</body>
</html>
