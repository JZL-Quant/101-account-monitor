<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新增账户 - Junli Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
    <main class="min-h-screen flex items-center justify-center p-6">
        <section class="bg-white rounded-lg shadow-lg p-8 w-full max-w-2xl">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold text-blue-600">新增账户</h1>
                <div class="flex items-center gap-4">
                    <a href="/doc" class="text-sm font-semibold text-blue-600 hover:text-blue-800">使用说明</a>
                    <a href="/operations" class="text-sm font-semibold text-gray-500 hover:text-blue-700">返回操作页</a>
                </div>
            </div>

            <form id="newAccountForm" action="/accounts/new" method="post" class="space-y-5" autocomplete="off">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="product_prefix" class="block text-sm font-semibold text-gray-700 mb-2">产品名称</label>
                        <input id="product_prefix" type="text" pattern="[A-Za-z0-9]+" placeholder="BV"
                            class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2" required />
                    </div>
                    <div>
                        <label for="product_sequence" class="block text-sm font-semibold text-gray-700 mb-2">序号</label>
                        <input id="product_sequence" type="text" inputmode="numeric" pattern="[0-9]+" placeholder="1"
                            class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2" required />
                    </div>
                    <div>
                        <label for="client" class="block text-sm font-semibold text-gray-700 mb-2">客户标识（Client）</label>
                        <input id="client" name="client" type="text" pattern="[A-Za-z0-9]+" placeholder="LTP"
                            class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2" required />
                    </div>
                </div>
                <input id="product_name" name="product_name" type="hidden" />
                <div>
                    <label for="initial_unit" class="block text-sm font-semibold text-gray-700 mb-2">委托数量</label>
                    <input id="initial_unit" name="initial_unit" type="number" step="0.00000001" min="0" placeholder="1000000"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2" required />
                </div>
                <div>
                    <label for="ccy" class="block text-sm font-semibold text-gray-700 mb-2">币种</label>
                    <select id="ccy" name="ccy" class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2" required>
                        <option value="USDT">USDT</option>
                        <option value="BTC">BTC</option>
                    </select>
                </div>
                <div>
                    <label for="exchange" class="block text-sm font-semibold text-gray-700 mb-2">交易所</label>
                    <select id="exchange" name="exchange" class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2" required>
                        {% for exchange in exchanges %}
                        <option value="{{ exchange.id }}">{{ exchange.label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="account_type" class="block text-sm font-semibold text-gray-700 mb-2">账户类型</label>
                    <select id="account_type" name="account_type" class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2" required>
                        <option value="account">普通账户</option>
                        <option value="account_pro">Pro 账户</option>
                    </select>
                </div>
                <div>
                    <label for="interest_rate" class="block text-sm font-semibold text-gray-700 mb-2">利率（Interest Rate）</label>
                    <input id="interest_rate" name="interest_rate" type="number" step="0.00000001" min="0" placeholder="留空自动推断"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2" />
                    <p class="mt-1 text-xs text-gray-500">留空时根据产品名称前缀和已有账户推断；无法推断时使用 0。</p>
                </div>
                <div>
                    <label for="api_key" class="block text-sm font-semibold text-gray-700 mb-2">API Key（隐藏输入）</label>
                    <input id="api_key" name="api_key" type="password" autocomplete="new-password"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2" required />
                </div>
                <div>
                    <label for="secret_key" class="block text-sm font-semibold text-gray-700 mb-2">Secret Key（隐藏输入）</label>
                    <input id="secret_key" name="secret_key" type="password" autocomplete="new-password"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2" required />
                    <p class="mt-1 text-xs text-gray-500">凭证只写入服务器配置，不会在页面或提交结果中返回。</p>
                </div>
                <button id="submitButton" type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-3 rounded-lg shadow-md">
                    保存并刷新账户
                </button>
            </form>
            <div id="responseMsg" class="mt-4 text-sm font-medium" role="status" aria-live="polite"></div>
        </section>
    </main>

    <script>
        const form = document.getElementById("newAccountForm");
        const responseMsg = document.getElementById("responseMsg");
        const submitButton = document.getElementById("submitButton");
        const productPrefix = document.getElementById("product_prefix");
        const productSequence = document.getElementById("product_sequence");
        const client = document.getElementById("client");
        const productName = document.getElementById("product_name");

        function showMessage(message, isError = false) {
            responseMsg.textContent = message;
            responseMsg.className = isError
                ? "mt-4 text-sm font-medium text-red-600"
                : "mt-4 text-sm font-medium text-green-600";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            productName.value = [productPrefix.value, productSequence.value]
                .map((part) => part.trim())
                .join("_");
            submitButton.disabled = true;
            submitButton.textContent = "正在保存...";
            showMessage("正在提交，请稍候...");

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams(new FormData(form)).toString()
                });
                const contentType = response.headers.get("content-type") || "";
                const data = contentType.includes("application/json")
                    ? await response.json()
                    : { detail: await response.text() };

                if (!response.ok) {
                    throw new Error(data.detail || `保存失败（HTTP ${response.status}）`);
                }

                showMessage(data.message);
                form.reset();
            } catch (error) {
                showMessage(error.message || "网络错误，请检查服务日志", true);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "保存并刷新账户";
            }
        });
    </script>
</body>
</html>
