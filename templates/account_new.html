<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <title>新增账户 - Junli Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
    <main class="min-h-screen flex items-center justify-center p-6">
        <section class="bg-white rounded-xl shadow-lg p-8 w-full max-w-lg">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold text-blue-600">新增账户</h1>
                <a href="/operations" class="text-sm font-semibold text-gray-500 hover:text-blue-700">返回操作页</a>
            </div>

            <form id="newAccountForm" class="space-y-5" autocomplete="off">
                <div>
                    <label for="product_name" class="block text-sm font-semibold text-gray-700 mb-2">产品名称</label>
                    <input id="product_name" name="product_name" type="text" placeholder="BV_10_LTP"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                        required />
                </div>

                <div>
                    <label for="initial_unit" class="block text-sm font-semibold text-gray-700 mb-2">委托数量</label>
                    <input id="initial_unit" name="initial_unit" type="number" step="0.00000001" min="0" placeholder="1000000"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                        required />
                </div>

                <div>
                    <label for="ccy" class="block text-sm font-semibold text-gray-700 mb-2">币种</label>
                    <select id="ccy" name="ccy"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                        required>
                        <option value="USDT">USDT</option>
                        <option value="BTC">BTC</option>
                    </select>
                </div>

                <div>
                    <label for="exchange" class="block text-sm font-semibold text-gray-700 mb-2">交易所</label>
                    <select id="exchange" name="exchange"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                        required>
                        {% for exchange in exchanges %}
                        <option value="{{ exchange.id }}">{{ exchange.label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="client" class="block text-sm font-semibold text-gray-700 mb-2">Client</label>
                    <input id="client" name="client" type="text" placeholder="K1"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                        required />
                    <p class="mt-1 text-xs text-gray-500">填写实际客户/资金来源标识。参考现有配置：Kiton/Brioni 常见 K1 或 K2，Loro 常见 B1，BV 按实际填写 HEIN、LTP、JZ、CC 等。</p>
                </div>

                <div>
                    <label for="interest_rate" class="block text-sm font-semibold text-gray-700 mb-2">Interest Rate</label>
                    <input id="interest_rate" name="interest_rate" type="number" step="0.00000001" min="0" placeholder="留空自动推断"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                    <p class="mt-1 text-xs text-gray-500">留空时按产品名称前缀从现有账户推断，例如 Kiton 多为 0.042，Brioni 多为 0.0075，BV 多为 0。新增产品类型推断不到时使用 0。</p>
                </div>

                <div>
                    <label for="api_key" class="block text-sm font-semibold text-gray-700 mb-2">API Key（隐藏输入）</label>
                    <input id="api_key" name="api_key" type="password" autocomplete="new-password"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                        required />
                </div>

                <div>
                    <label for="secret_key" class="block text-sm font-semibold text-gray-700 mb-2">Secret Key（隐藏输入）</label>
                    <input id="secret_key" name="secret_key" type="password" autocomplete="new-password"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                        required />
                    <p class="mt-1 text-xs text-gray-500">凭证只用于写入配置文件，页面不会展示，也不会在提交结果中返回。</p>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md focus:outline-none focus:ring-4 focus:ring-blue-300">
                    保存并刷新账户
                </button>
            </form>

            <div id="responseMsg" class="mt-4 text-sm font-medium"></div>
        </section>
    </main>

    <script>
        const form = document.getElementById("newAccountForm");
        const responseMsg = document.getElementById("responseMsg");

        function showMessage(msg, isError = false) {
            responseMsg.textContent = msg;
            responseMsg.className = isError
                ? "mt-4 text-sm font-medium text-red-600"
                : "mt-4 text-sm font-medium text-green-600";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const formData = new URLSearchParams(new FormData(form));

            try {
                const res = await fetch("/accounts/new", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData.toString()
                });
                const data = await res.json();
                if (!res.ok) {
                    showMessage(data.detail || "新增账户失败", true);
                    return;
                }
                showMessage(`${data.message}，交易所 ${data.exchange}，类型 ${data.account_type}，数量 ${data.initial_unit} ${data.ccy}，客户 ${data.client}，利率 ${data.interest_rate}`);
                form.reset();
            } catch (error) {
                showMessage("网络错误", true);
            }
        });
    </script>
</body>
</html>
