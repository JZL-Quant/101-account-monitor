<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Junli Finance · Risk Monitor</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07101f;
            --panel: rgba(13, 27, 49, .88);
            --line: rgba(148, 163, 184, .18);
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 10%, rgba(14, 165, 233, .16), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(59, 130, 246, .13), transparent 34%),
                var(--bg);
        }

        main {
            width: min(900px, 100%);
            padding: clamp(28px, 5vw, 56px);
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--panel);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .35);
            backdrop-filter: blur(14px);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(36px, 7vw, 64px);
            line-height: 1;
            letter-spacing: -.04em;
        }

        .intro {
            margin: 18px 0 36px;
            color: var(--muted);
            font-size: 16px;
        }

        nav {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        a {
            min-height: 108px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(15, 23, 42, .72);
            transition: transform .18s ease, border-color .18s ease, background .18s ease;
        }

        a:hover, a:focus-visible {
            outline: none;
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, .7);
            background: rgba(14, 165, 233, .1);
        }

        .label {
            font-size: 17px;
            font-weight: 750;
            letter-spacing: .05em;
        }

        .description {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .primary {
            grid-column: span 2;
            background: linear-gradient(120deg, rgba(14, 165, 233, .2), rgba(37, 99, 235, .12));
        }

        @media (max-width: 620px) {
            nav { grid-template-columns: 1fr; }
            .primary { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Risk Monitor</p>
        <h1>Junli Finance</h1>
        <p class="intro">请选择要进入的功能。</p>

        <nav aria-label="功能导航">
            <a class="primary" href="/accounts">
                <span class="label">ACCOUNT</span>
                <span class="description">查看账户、下载快照和归档账户</span>
            </a>
            <a href="/operations">
                <span class="label">OPERATIONS</span>
                <span class="description">查询并处理大额资金变动</span>
            </a>
            <a href="/accounts/new">
                <span class="label">NEW ACCOUNT</span>
                <span class="description">添加新的监控账户</span>
            </a>
            <a href="/doc">
                <span class="label">DOCUMENTATION</span>
                <span class="description">查看网页操作使用说明</span>
            </a>
            <a href="/metrics">
                <span class="label">METRICS</span>
                <span class="description">查看 Prometheus 原始指标</span>
            </a>
        </nav>
    </main>
</body>
</html>
