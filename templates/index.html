<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>Junli Finance 申购系统</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 leading-relaxed min-h-screen flex flex-col">

    <!-- 顶部标题栏 -->
    <header style="
        background-image: url('/static/arrow.jpg');
        background-size: cover;
        background-position: center 70%;
        background-repeat: no-repeat;">
        <div class="bg-white bg-opacity-60 text-gray-900 py-12 shadow-xl backdrop-blur-sm border-b border-gray-300">
            <div class="max-w-5xl px-6">
                <h1 class="text-5xl font-extrabold tracking-wide text-red-600 drop-shadow-sm text-left">Junli Finance</h1>
                <p class="text-md text-gray-600 mt-2 tracking-widest uppercase">Binance账户申购分红操作平台</p>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
            <h2 class="text-3xl font-bold mb-6 text-center text-blue-600">资金操作</h2>

            <form id="actionForm" class="space-y-6">
                <!-- 账户选择 -->
                <div>
                    <label for="account_name" class="block text-sm font-semibold text-gray-700 mb-2">选择账户</label>
                    <div class="relative">
                        <select id="account_name" name="account_name"
                            class="block appearance-none w-full bg-gray-50 border border-gray-300 hover:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 rounded-lg px-4 py-2 pr-8 shadow-sm transition duration-300 ease-in-out cursor-pointer"
                            required>
                            {% for account in accounts %}
                            <option value="{{ account.name }}">{{ account.label }}</option>
                            {% endfor %}
                        </select>
                        <div
                            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 20 20">
                                <path d="M7 10l5 5 5-5H7z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- 日期输入 -->
                <div>
                    <label for="action_date" class="block text-sm font-semibold text-gray-700 mb-2">日期（YYYY-MM-DD）</label>
                    <input type="date" id="action_date" name="action_date"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
                        required />
                </div>

                <!-- 金额输入 -->
                <div>
                    <label for="action_amount" class="block text-sm font-semibold text-gray-700 mb-2">金额</label>
                    <input type="number" step="0.01" id="action_amount" name="action_amount"
                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
                        required />
                </div>

                <div>
                    <label for="outflow_type" class="block text-sm font-semibold text-gray-700 mb-2">资金转出类型</label>
                    <select id="outflow_type" class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2">
                        <option value="dividend">分红</option>
                        <option value="interest_deduction">扣息</option>
                        <option value="withdrawal">赎回</option>
                    </select>
                </div>

                <div class="flex space-x-6 mt-6">
                    <button type="button" id="btn_subscribe"
                        class="flex-1 bg-gradient-to-r from-blue-500 to-blue-300 hover:from-blue-600 hover:to-blue-400 text-white font-semibold py-3 rounded-lg shadow-md transform transition duration-300 hover:-translate-y-1 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-300">
                        申购
                    </button>
                    <button type="button" id="btn_dividend"
                        class="flex-1 bg-gradient-to-r from-green-500 to-green-300 hover:from-green-600 hover:to-green-400 text-white font-semibold py-3 rounded-lg shadow-md transform transition duration-300 hover:-translate-y-1 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-green-300">
                        资金转出
                    </button>
                </div>
            </form>

            <!-- 响应提示 -->
            <div id="responseMsg" class="mt-4 text-green-600 font-medium"></div>
            <div class="mt-6 text-center">
                <a href="/accounts/new" class="text-sm font-semibold text-blue-600 hover:text-blue-800">新增账户</a>
            </div>
        </div>
    </main>

    <script>
        const responseMsg = document.getElementById("responseMsg");

        function showMessage(msg, isError = false) {
            responseMsg.textContent = msg;
            responseMsg.className = isError
                ? "mt-4 text-red-600 font-medium"
                : "mt-4 text-green-600 font-medium";
        }

        document.getElementById("btn_subscribe").addEventListener("click", async () => {
            const account = document.getElementById("account_name").value;
            const date = document.getElementById("action_date").value.trim();
            const amountStr = document.getElementById("action_amount").value.trim();
            const amount = parseFloat(amountStr);

            if (!account || !date || isNaN(amount)) {
                showMessage("请完整填写账户、日期和金额", true);
                return;
            }

            try {
                const res = await fetch(`/subscribe_form/${account}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: `subscription_date=${encodeURIComponent(date)}&subscription_amount=${encodeURIComponent(amount)}`
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage(data.message);
                } else {
                    showMessage(data.detail || "申购失败", true);
                }
            } catch (error) {
                showMessage("网络错误", true);
            }
        });

        document.getElementById("btn_dividend").addEventListener("click", async () => {
            const account = document.getElementById("account_name").value;
            const date = document.getElementById("action_date").value.trim();
            const amountStr = document.getElementById("action_amount").value.trim();
            const amount = parseFloat(amountStr);
            const outflowType = document.getElementById("outflow_type").value;
            const outflowConfig = {
                dividend: { path: "dividend_form", date: "dividend_date", amount: "dividend_amount", label: "分红" },
                interest_deduction: { path: "interest_deduction_form", date: "deduction_date", amount: "deduction_amount", label: "扣息" },
                withdrawal: { path: "withdrawal_form", date: "withdrawal_date", amount: "withdrawal_amount", label: "赎回" }
            }[outflowType];

            if (!account || !date || isNaN(amount)) {
                showMessage("请完整填写账户、日期和金额", true);
                return;
            }

            try {
                const res = await fetch(`/${outflowConfig.path}/${account}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: `${outflowConfig.date}=${encodeURIComponent(date)}&${outflowConfig.amount}=${encodeURIComponent(amount)}`
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage(data.message);
                } else {
                    showMessage(data.detail || `${outflowConfig.label}失败`, true);
                }
            } catch (error) {
                showMessage("网络错误", true);
            }
        });
    </script>
</body>
</html>
