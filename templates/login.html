<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>登录 - Junli Finance 申购系统</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 leading-relaxed min-h-screen flex flex-col">

    <!-- 顶部标题栏 -->
    <header style="background-image: url('/static/arrow.jpg'); background-size: cover; background-position: center 70%; background-repeat: no-repeat;">
        <div class="bg-white bg-opacity-60 text-gray-900 py-12 shadow-xl backdrop-blur-sm border-b border-gray-300">
            <div class="max-w-5xl px-6">
                <h1 class="text-5xl font-extrabold tracking-wide text-red-600 drop-shadow-sm text-left">Junli Finance</h1>
                <p class="text-md text-gray-600 mt-2 tracking-widest uppercase">Binance账户申购分红操作平台</p>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <div class="max-w-md mx-auto p-8 bg-white shadow-lg rounded-lg mt-20">
        <h2 class="text-3xl font-bold text-center mb-6">登录</h2>

        <!-- 错误消息 -->
        <div id="errorMessage" class="text-red-600 text-center mb-4 hidden">
            <!-- 错误消息会动态显示 -->
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" action="/login" method="POST">
            <div class="mb-4">
                <label for="account" class="block text-sm font-semibold text-gray-700">用户名</label>
                <input type="text" id="account" name="account" class="w-full px-4 py-2 border rounded-lg" required>
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-semibold text-gray-700">密码</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 border rounded-lg" required>
            </div>

            <button type="submit" class="w-full py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-400">登录</button>
        </form>
    </div>

    <script>
        // 如果后端返回错误信息，显示在页面上
        const urlParams = new URLSearchParams(window.location.search);
        const errorMessage = urlParams.get('error');
        if (errorMessage) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = errorMessage;
            errorDiv.classList.remove('hidden'); // 显示错误信息
        }
    </script>

</body>
</html>
