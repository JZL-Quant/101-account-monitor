# Copy this file to /etc/nginx/conf.d/account-monitor.conf
# or adapt it into /etc/nginx/sites-available/.
#
# Replace monitor.example.com and certificate paths before enabling.

upstream account_monitor_app {
    server 127.0.0.1:7007;
    keepalive 16;
}

upstream kucoin_exposure_app {
    server 127.0.0.1:8000;
    keepalive 4;
}

server {
    listen 80;
    server_name monitor.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name monitor.example.com;

    ssl_certificate /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location = /exposure/kucoin {
        return 301 /exposure/kucoin/;
    }

    location /exposure/kucoin/ {
        # 末尾的 / 用于去掉 /exposure/kucoin/ 前缀后再转发给 FastAPI。
        proxy_pass http://kucoin_exposure_app/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://account_monitor_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
